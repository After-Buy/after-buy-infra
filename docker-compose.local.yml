version: '3.8'

services:
  # 내 PC(운영체제)에 이미 직접 깔려있는 찐 로컬 MySQL을 바라보도록 설정 덮어쓰기
  # 도커 안에서 내 PC로 구멍을 뚫고 나올 때는 'localhost'가 아니라 'host.docker.internal'을 씁니다!
  auth-service:
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_NAME=auth_db
      - DB_USERNAME=root # (내 PC MySQL 아이디)
      - DB_PASSWORD=root # (내 PC MySQL 비번)

  device-service:
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_NAME=device_db
      - DB_USERNAME=root
      - DB_PASSWORD=root

  notification-service:
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_NAME=notification_db
      - DB_USERNAME=root
      - DB_PASSWORD=root

  admin-service:
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_NAME=admin_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
