user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    # Backend Upstreams
    upstream auth_service {
        server auth-service:8081;
    }
    
    upstream device_service {
        server device-service:8082;
    }
    
    upstream notification_service {
        server notification-service:8083;
    }
    
    upstream admin_service {
        server admin-service:8084;
    }

    server {
        listen 80;
        server_name _; # 여기에 도메인이 생기면 변경합니다 (예: api.afterbuy.com)

        # CORS 설정 공통 처리 (필요시 활성화)
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';

        # --- Auth Service ---
        location /api/auth/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- Device Service ---
        location /api/devices/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://device_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- Notification Service ---
        location /api/notifications/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- Admin Service ---
        location /api/admin/ {
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            proxy_pass http://admin_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 상태 점검(Health Check) 엔드포인트
        location /health {
            access_log off;
            return 200 'OK';
        }
    }
}
